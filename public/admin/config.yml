# Decap CMS Configuration for Location Sound Collective
# https://decapcms.org/docs/configuration-options/

backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to main)

# Uncomment below for local development with npx decap-server
local_backend: false

# Media files configuration
media_folder: "static/img" # Folder where user-uploaded files will be stored
public_folder: "/img" # The src attribute for uploaded media

# Slug configuration
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# Editorial workflow for draft/review/publish states
publish_mode: editorial_workflow

# Site URL (optional, helps with preview)
site_url: https://lscollective.netlify.app
display_url: https://lscollective.netlify.app
logo_url: /img/logo.webp

# Search functionality
search: true

# Collections (content types)
collections:
  # ============================================
  # WORK/PORTFOLIO PROJECTS
  # ============================================
  - name: "work"
    label: "🎬 Projects"
    label_singular: "Project"
    description: "Add and edit your sound recording projects and portfolio pieces"
    folder: "content/work"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    preview_path: "work/{{slug}}"
    summary: "{{title}} — {{location}}"
    sortable_fields: ["title", "date", "weight"]
    view_filters:
      - label: "Drafts (Hidden)"
        field: draft
        pattern: true
    view_groups:
      - label: "Year"
        field: date
        pattern: \d{4}
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Project name - what should this project be called?"
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        hint: "When was this project completed?"
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        hint: "⚠️ If ON, this project will NOT appear on the live website"
      - label: "Type"
        name: "type"
        widget: "hidden"
        default: "work"
      - label: "Image"
        name: "cover"
        widget: "image"
        required: false
        hint: "Main photo for this project needs to be named 'cover'. Landscape orientation works best. Can add multiple pictures."
        media_folder: ""
        public_folder: ""
      - label: "Short Description"
        name: "description"
        widget: "text"
        required: false
        hint: "1-2 sentences describing the project. This appears in Google search results and social media shares (not on the page itself)."
      - label: "Summary"
        name: "summary"
        widget: "text"
        required: false
        hint: "A longer summary (3-4 sentences) shown on the Work listing page. (if missing: truncate the main text)"
      - label: "Location"
        name: "location"
        widget: "string"
        required: false
        hint: "Where was this recorded? e.g., London, Manchester, On Location UK"
      - label: "Recordists"
        name: "recordists"
        widget: "list"
        required: false
        hint: "Who recorded this project? Select team members from the dropdown."
        add_to_top: true
        label_singular: "recordist"
        field:
          label: "Name"
          name: "name"
          widget: "relation"
          collection: "team"
          search_fields: ["title"]
          value_field: "title"
          display_fields: ["title"]
      - label: "Client"
        name: "client"
        widget: "string"
        required: false
        hint: "Who commissioned this project? (e.g., BBC, Netflix, ITV)"
      - label: "Equipment"
        name: "equipment"
        widget: "list"
        required: false
        hint: "What gear was used? Add one item per line (e.g., Sound Devices 833, Sennheiser MKH 416)"
        add_to_top: true
        label_singular: "item"
        field:
          label: "Equipment Item"
          name: "item"
          widget: "string"
      - label: "Challenges"
        name: "challenges"
        widget: "list"
        required: false
        hint: "What obstacles did you face? Add one challenge per line."
        add_to_top: true
        label_singular: "challenge"
        field:
          label: "Challenge"
          name: "challenge"
          widget: "string"
      - label: "YouTube Link"
        name: "youtube_link"
        widget: "list"
        required: false
        hint: "Add a youtube video!"
        add_to_top: true
        label_singular: "result"
        field:
          label: "Result"
          name: "result"
          widget: "string"
      - label: "Notes"
        name: "notes"
        widget: "text"
        required: false
        hint: "Any additional information about this project"
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Keywords to help find this project. Examples: field-recording, documentary, sports, drama, commercial"
        add_to_top: true
        label_singular: "tag"
        field:
          label: "Tag"
          name: "tag"
          widget: "string"
      - label: "Full Project Description"
        name: "body"
        widget: "markdown"
        hint: "The main content of the project page. You can add headings, bold text, links, and images using the toolbar above."

  # ============================================
  # TEAM MEMBERS
  # ============================================
  - name: "team"
    label: "👥 Team Members"
    label_singular: "Team Member"
    description: "Add and edit team member profiles"
    folder: "content/team"
    create: true
    slug: "{{slug}}"
    preview_path: "team/{{slug}}"
    summary: "{{title}} — {{role}}"
    sortable_fields: ["title", "weight"]
    fields:
      - label: "Full Name"
        name: "title"
        widget: "string"
        hint: "The team member's name as it should appear on the website"
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        hint: "⚠️ If ON, this person will NOT appear on the live website"
      - label: "Display Order"
        name: "weight"
        widget: "number"
        default: 1
        value_type: "int"
        hint: "Controls the order team members appear. Lower numbers = shown first."
      - label: "Job Title / Role"
        name: "role"
        widget: "string"
        default: "Sound Recordist"
        hint: "e.g., Sound Recordist, Boom Operator, Sound Mixer"
      - label: "Profile Photo (Full)"
        name: "profile_picture"
        widget: "image"
        required: false
        hint: "Full profile photo - portrait orientation (2:3 ratio) works best. This appears on their CV page."
      - label: "Profile Photo (Circle)"
        name: "profile_picture_circle"
        widget: "image"
        required: false
        hint: "Square photo that will be displayed in a circle. Used for thumbnails on the home page and team listings."
      - label: "SEO Description"
        name: "description"
        widget: "text"
        required: false
        hint: "A short description for search engines (Google). 1-2 sentences about this person."
      - label: "Keywords (SEO)"
        name: "keywords"
        widget: "list"
        required: false
        hint: "Words that help search engines find this page. Examples: sound recordist, location sound, film audio"
        add_to_top: true
        label_singular: "keyword"
        field:
          label: "Keyword"
          name: "keyword"
          widget: "string"
      - label: "Specializations"
        name: "specializations"
        widget: "list"
        required: false
        hint: "What does this person specialize in? Examples: Location Recording, Boom Operating, Sound Mixing, Post Production"
        add_to_top: true
        label_singular: "specialization"
        field:
          label: "Specialization"
          name: "specialization"
          widget: "string"
      - label: "Contact Information"
        name: "contact"
        widget: "object"
        collapsed: true
        required: false
        hint: "Optional - only fill in what you want to display publicly"
        fields:
          - label: "Email Address"
            name: "email"
            widget: "string"
            required: false
            hint: "e.g., john@example.com - will be displayed on their profile page"
          - label: "Phone Number"
            name: "phone"
            widget: "string"
            required: false
            hint: "e.g., +44 7700 900123 - will be displayed on their profile page"
          - label: "Personal Website"
            name: "website"
            widget: "string"
            required: false
            hint: "e.g., https://www.johnsmith.com"
      - label: "Social Media Links"
        name: "social"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - label: "Instagram Profile URL"
            name: "instagram"
            widget: "string"
            required: false
            hint: "Full link to their Instagram profile, e.g., https://instagram.com/johnsound"
      - label: "Experience"
        name: "experience"
        widget: "list"
        collapsed: true
        required: false
        hint: "Work history - add each job or position separately"
        add_to_top: true
        label_singular: "position"
        summary: "{{fields.title}} at {{fields.company}} ({{fields.period}})"
        fields:
          - label: "Job Title"
            name: "title"
            widget: "string"
            hint: "e.g., Senior Sound Recordist, Freelance Boom Operator"
          - label: "Company / Production"
            name: "company"
            widget: "string"
            hint: "e.g., BBC, Various Productions, Location Sound Collective"
          - label: "Time Period"
            name: "period"
            widget: "string"
            hint: "e.g., 2020 - Present, Jan 2018 - Dec 2019"
          - label: "Description"
            name: "description"
            widget: "text"
            required: false
            hint: "Brief description of the role and responsibilities"
          - label: "Key Achievements"
            name: "highlights"
            widget: "list"
            required: false
            hint: "Notable accomplishments in this role. Add one achievement per line."
            add_to_top: true
            label_singular: "achievement"
            field:
              label: "Achievement"
              name: "achievement"
              widget: "string"
      - label: "Education"
        name: "education"
        widget: "list"
        collapsed: true
        required: false
        hint: "Qualifications and training - add each separately"
        add_to_top: true
        label_singular: "qualification"
        summary: "{{fields.degree}} - {{fields.institution}} ({{fields.year}})"
        fields:
          - label: "Qualification / Degree"
            name: "degree"
            widget: "string"
            hint: "e.g., BA (Hons) Sound Design, BKSTS Certificate"
          - label: "Institution"
            name: "institution"
            widget: "string"
            hint: "e.g., University of Westminster, National Film School"
          - label: "Year"
            name: "year"
            widget: "string"
            hint: "e.g., 2015, 2018-2020"
          - label: "Description"
            name: "description"
            widget: "text"
            required: false
            hint: "Optional - any additional details about this qualification"
      - label: "Skills"
        name: "skills"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - label: "Technical Skills"
            name: "technical"
            widget: "list"
            required: false
            hint: "What technical abilities does this person have? Examples: Multi-track field recording, Wireless microphone systems, Pro Tools"
            add_to_top: true
            label_singular: "skill"
            field:
              label: "Skill"
              name: "skill"
              widget: "string"
          - label: "Equipment Proficiency"
            name: "equipment"
            widget: "list"
            required: false
            hint: "What equipment can this person operate? Examples: Sound Devices 833, Lectrosonics wireless, DPA microphones"
            add_to_top: true
            label_singular: "equipment"
            field:
              label: "Equipment"
              name: "equipment"
              widget: "string"
      - label: "Notable Achievements"
        name: "highlights"
        widget: "list"
        required: false
        hint: "Awards, notable projects, press mentions. Examples: BAFTA-nominated documentary, Featured in Sound on Sound magazine"
        add_to_top: true
        label_singular: "achievement"
        field:
          label: "Achievement"
          name: "achievement"
          widget: "string"
      - label: "Biography"
        name: "body"
        widget: "markdown"
        hint: "Write about this person - their background, experience, approach to work, and what makes them unique. This is the main content on their profile page."

  # ============================================
  # PAGES
  # Edit the main content of your website pages
  # ============================================
  - name: "pages"
    label: "📄 Pages"
    label_singular: "Page"
    description: "Edit the content that appears on the main pages of your website"
    files:
      - label: "🏠 Home Page"
        name: "home"
        file: "content/_index.md"
        fields:
          - label: "Page Title"
            name: "title"
            widget: "string"
            hint: "The main headline displayed at the top of the home page"
          - label: "Page Content"
            name: "body"
            widget: "markdown"
            hint: "The main text content displayed on the home page. Use the toolbar to add headings, bold text, links, etc."

      - label: "📧 Contact Page"
        name: "contact"
        file: "content/contact.md"
        fields:
          - label: "Page Title"
            name: "title"
            widget: "string"
            hint: "The headline displayed at the top of the contact page"
          - label: "Layout"
            name: "layout"
            widget: "hidden"
            default: "contact"
          - label: "Introduction Text"
            name: "body"
            widget: "markdown"
            hint: "Text that appears above the contact form. Introduce yourself and encourage visitors to get in touch."

      - label: "👥 Team Page"
        name: "team-index"
        file: "content/team/_index.md"
        fields:
          - label: "Page Title"
            name: "title"
            widget: "string"
            hint: "The headline displayed at the top of the team page"
          - label: "Tagline"
            name: "summary"
            widget: "string"
            required: false
            hint: "A short tagline that appears below the title (optional)"
          - label: "Introduction Text"
            name: "body"
            widget: "markdown"
            hint: "Text that introduces your team. This appears before the team member listings."

      - label: "🎬 Work / Portfolio Page"
        name: "work-index"
        file: "content/work/_index.md"
        fields:
          - label: "Page Title"
            name: "title"
            widget: "string"
            hint: "The headline displayed at the top of the work/portfolio page"
          - label: "Short Description"
            name: "description"
            widget: "text"
            required: false
            hint: "A brief description shown below the title"
          - label: "Introduction Text"
            name: "body"
            widget: "markdown"
            hint: "Text that introduces your work. This appears before the project listings."

      - label: "🔒 Privacy Policy"
        name: "privacy"
        file: "content/privacy.md"
        fields:
          - label: "Page Title"
            name: "title"
            widget: "string"
          - label: "Policy Content"
            name: "body"
            widget: "markdown"
            hint: "Your privacy policy text"

      - label: "✅ Thank You Page"
        name: "thank-you"
        file: "content/thank-you.md"
        fields:
          - label: "Page Title"
            name: "title"
            widget: "string"
            hint: "e.g., Thank You!, Message Sent, etc."
          - label: "Layout"
            name: "layout"
            widget: "hidden"
            default: "thank-you"
          - label: "Thank You Message"
            name: "body"
            widget: "markdown"
            hint: "The message visitors see after submitting the contact form"

  # ============================================
  # SITE SETTINGS
  # Configure your website's global settings
  # ============================================
  - name: "settings"
    label: "⚙️ Site Settings"
    description: "Global settings that affect your entire website"
    files:
      - label: "General Settings"
        name: "general"
        file: "config/_default/params.toml"
        fields:
          # - label: "Site Description (for Google)"
          #   name: "description"
          #   widget: "text"
          #   required: false
          #   hint: "How your site appears in Google search results. 1-2 sentences describing what Location Sound Collective does."
          # - label: "Tagline"
          #   name: "tagline"
          #   widget: "string"
          #   required: false
          #   hint: "A short slogan or tagline for your business"
          # - label: "SEO Keywords"
          #   name: "keywords"
          #   widget: "string"
          #   required: false
          #   hint: "Words people might search for to find you. Separate with commas. Example: sound recording, location sound, film audio, London"
          - label: "Feature Toggles"
            name: "features"
            widget: "object"
            hint: "Turn sections of your website on or off"
            fields:
              - label: "Show 'View Projects' on Team Pages"
                name: "enableRecordistsTaxonomy"
                widget: "boolean"
                default: true
                hint: "When ON, team member pages will show a button linking to their projects"
              - label: "Show Work / Portfolio Section"
                name: "enableWorkSection"
                widget: "boolean"
                default: true
                hint: "When ON, the Work section appears in menus and is accessible. When OFF, it's hidden."
          - label: "Author / Business Info"
            name: "author"
            widget: "object"
            collapsed: true
            fields:
              - label: "Business Name"
                name: "name"
                widget: "string"
                default: "Location Sound Collective"
              - label: "Contact Email"
                name: "email"
                widget: "string"
                required: false
          - label: "Social Media Accounts"
            name: "social"
            widget: "object"
            collapsed: true
            hint: "Enter just your username/handle - not the full URL"
            fields:
              - label: "Instagram Username"
                name: "instagram"
                widget: "string"
                required: false
                hint: "Just the username, e.g., lscollective (not the full URL)"
              - label: "Twitter/X Username"
                name: "twitter"
                widget: "string"
                required: false
                hint: "Just the username, e.g., lscollective"
              - label: "Facebook Page"
                name: "facebook"
                widget: "string"
                required: false
                hint: "Just the page name, e.g., Locationsoundcollective"
              - label: "LinkedIn"
                name: "linkedin"
                widget: "string"
                required: false
                hint: "e.g., company/london-sound-collective"
              - label: "YouTube Channel"
                name: "youtube"
                widget: "string"
                required: false
                hint: "e.g., channel/UCxxxxxxxxx or @channelname"
          - label: "Menu Appearance"
            name: "menu"
            widget: "object"
            collapsed: true
            hint: "Customize how the navigation menu looks"
            fields:
              # - label: "Close Button Color"
              #   name: "closeButtonColor"
              #   widget: "string"
              #   default: "black"
              # - label: "Close Button Hover Color"
              #   name: "closeButtonHoverColor"
              #   widget: "string"
              #   default: "black"
              - label: "Contact Button Color (Home Page)"
                name: "homeContactButtonColor"
                widget: "select"
                options: 
                  - label: "Amber (Gold)"
                    value: "amber"
                  - label: "Red"
                    value: "red"
                  - label: "Blue"
                    value: "blue"
                  - label: "Green"
                    value: "green"
                  - label: "Purple"
                    value: "purple"
                  - label: "Slate (Grey)"
                    value: "slate"
                default: "amber"