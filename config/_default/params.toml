# ============================================
# DICE COMPONENT CONFIGURATION
# ============================================
# The 3D rotating dice on the homepage "Meet The Team" section
#
# COLOR OPTIONS:
# - Theme colors: "inverse", "base", "secondary", "accent", "primary", "text"
# - Tailwind colors: "slate", "gray", "zinc", "neutral", "stone", "red", 
#   "orange", "amber", "yellow", "lime", "green", "emerald", "teal", "cyan", 
#   "sky", "blue", "indigo", "violet", "purple", "fuchsia", "pink", "rose"
#
# When using Tailwind colors, the "Shade" value (100-900) controls darkness
# ============================================

[dice]

# --- BACKGROUND ---
# Color of the dice faces
background = "violet"           # Color name (theme or Tailwind)
backgroundShade = 300          # Tailwind shade (ignored for theme colors)

# --- BORDER ---
# Border around each dice face
borderColor = "emeralde"           # Color name
borderShade = 500              # Tailwind shade
borderWidth = 1                # Border thickness in pixels (1-5)

# --- SHADOW / GLOW ---
# Shadow effect on dice faces
shadowStyle = "glow"           # Options: "none", "soft", "hard", "glow"
shadowColor = "green"           # Color for glow effect
shadowShade = 500              # Tailwind shade

# --- IMAGE FILTERS ---
# Applied to team member photos on the dice
imageGrayscale = 50            # Grayscale % (0 = full color, 100 = black & white)
imageContrast = 1.1            # Contrast multiplier (1.0 = normal)
imageGrayscaleHover = 10       # Grayscale % when hovering on dice
imageContrastHover = 1         # Contrast when hovering

# --- EFFECTS ---
enableScanlines = true         # CRT-style scanline overlay on faces
