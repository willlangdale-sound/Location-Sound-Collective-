

<div class="contact-container flex flex-col items-center justify-center p-5 border-2 border-solid
w-full max-w-3xl mx-auto text-center
text-base-text transition-colors duration-500
border-primary/50 dark:border-accent shadow-[0_0_24px_hsl(var(--color-accent)/0.3)]">

<p class="mb-6 text-base md:text-lg">
    Ready to bring your sound to the next level? Get in touch with us today to discuss your project needs.
</p>
<div class="flex justify-center">
  <a href="/contact">
    <div class="group relative flex items-center justify-center p-3 h-10 w-[200px]
                text-lg font-normal bg-transparent overflow-hidden transition-all duration-100">

      <span class="absolute left-0 h-full w-8 border-y border-l border-accent
                   transition-all duration-700 group-hover:w-full"></span>

      <h4 class="absolute text-accent transition-all duration-200
                 group-hover:opacity-0 group-hover:-translate-x-full">
        Contact us
      </h4>

      <span class="absolute translate-x-full opacity-0 transition-all duration-200
                   group-hover:translate-x-0 group-hover:opacity-100">
        <span class="material-icons text-accent text-lg">mail</span>
      </span>

      <span class="absolute right-0 h-full w-8 border-y border-r border-accent
                   transition-all duration-700 group-hover:w-full"></span>
    </div>
  </a>
</div>

<!-- Contact info (mobile only) -->
<div class="flex flex-col md:flex-row md:gap-6 items-center gap-2 opacity-100 m-2 mb-3 text-xl md:text-2xl">
  {{ with .Site.Params.author.phone }}
  <p>
    <a href="tel:{{ . }}" class="hover:opacity-100 hover:text-accent transition-all duration-200">
      <span class="material-symbols-outlined text-base align-middle">call</span>
      {{ . }}
    </a>
  </p>
  {{ end }}
  {{ with .Site.Params.author.email }}
  <p>
    <a href="mailto:{{ . }}" class="hover:opacity-100 hover:text-accent transition-all duration-200">
      <span class="material-symbols-outlined text-base align-middle">mail</span>
      {{ . }}
    </a>
  </p>
  {{ end }}
</div>

</div>
