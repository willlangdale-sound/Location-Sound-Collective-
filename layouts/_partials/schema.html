<!-- layouts/_partials/schema.html -->

<!-- ============================================
     ORGANIZATION SCHEMA (All Pages)
     ============================================ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ .Site.Title }}",
  "url": "{{ .Site.BaseURL }}",
  "logo": {
    "@type": "ImageObject",
    "url": "{{ "/img/logo_centered.png" | absURL }}"
  },
  "description": "{{ .Site.Params.description }}",
  "telephone": "{{ .Site.Params.author.phone }}",
  "email": "{{ .Site.Params.author.email }}",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "London",
    "addressCountry": "GB"
  }
  {{- with .Site.Params.social.instagram }},
  "sameAs": [
    "https://instagram.com/{{ . }}"
    {{- with $.Site.Params.social.twitter }},"https://twitter.com/{{ . }}"{{ end }}
    {{- with $.Site.Params.social.facebook }},"https://facebook.com/{{ . }}"{{ end }}
    {{- with $.Site.Params.social.linkedin }},"https://linkedin.com/{{ . }}"{{ end }}
    {{- with $.Site.Params.social.youtube }},"https://youtube.com/{{ . }}"{{ end }}
  ]
  {{- end }}
}
</script>

<!-- ============================================
     WEBSITE SCHEMA (All Pages)
     ============================================ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ .Site.Title }}",
  "url": "{{ .Site.BaseURL }}"
}
</script>

<!-- ============================================
     PAGE-SPECIFIC SCHEMAS
     ============================================ -->

{{- if eq .Section "work" }}
{{- if .IsPage }}
<!-- CREATIVE WORK SCHEMA (Portfolio Projects) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CreativeWork",
  "name": "{{ .Title }}",
  "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 160 }}{{ end }}",
  "url": "{{ .Permalink }}",
  "datePublished": "{{ .PublishDate.Format "2006-01-02" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02" }}"
  {{- with .Params.location }},
  "locationCreated": {
    "@type": "Place",
    "name": "{{ . }}"
  }
  {{- end }}
  {{- with .Params.recordists }},
  "creator": [
    {{- range $index, $person := . }}
    {{- if $index }},{{ end }}
    {
      "@type": "Person",
      "name": "{{ $person }}"
    }
    {{- end }}
  ]
  {{- end }}
}
</script>
{{- end }}
{{- end }}

{{- if eq .Section "team" }}
{{- if .IsPage }}
<!-- PERSON SCHEMA (Team Members) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ .Title }}",
  "url": "{{ .Permalink }}"
  {{- with .Params.role }},
  "jobTitle": "{{ if reflect.IsSlice . }}{{ delimit . ", " }}{{ else }}{{ . }}{{ end }}"
  {{- end }}
  {{- with .Params.profile_picture }},
  "image": "{{ . | absURL }}"
  {{- end }}
  {{- with .Params.social.instagram }},
  "sameAs": ["https://instagram.com/{{ . }}"]
  {{- end }},
  "worksFor": {
    "@type": "Organization",
    "name": "{{ .Site.Title }}",
    "url": "{{ .Site.BaseURL }}"
  }
}
</script>
{{- end }}
{{- end }}

{{- if not .IsHome }}
<!-- BREADCRUMB SCHEMA (All non-home pages) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ .Site.BaseURL }}"
    }
    {{- $ancestors := .Ancestors.Reverse }}
    {{- range $i, $page := $ancestors }},
    {
      "@type": "ListItem",
      "position": {{ add $i 2 }},
      "name": "{{ $page.Title }}",
      "item": "{{ $page.Permalink }}"
    }
    {{- end }},
    {
      "@type": "ListItem",
      "position": {{ add (len .Ancestors) 2 }},
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
  ]
}
</script>
{{- end }}
