<!-- Header: LSC text left, nav right -->
<div class="flex flex-row justify-center md:justify-start items-center gap-6 pt-4 pb-4 px-4 lg:px-8 max-w-screen-xl mx-auto">

  <!-- LSC text (no logo image in header) -->
  <a href="{{ .Site.BaseURL }}" class="flex-shrink-0">
    <span class="text-5xl md:text-6xl text-[#E2E6C7]" style="font-family: 'Anton', sans-serif;">LSC</span>
  </a>

  <!-- Desktop nav (always visible on md+) -->
  <nav class="hidden md:flex z-50 ml-auto transition-colors duration-200">
    {{ partial "nav.html" . }}
  </nav>

  <!-- Mobile menu toggle (hidden on md+) -->
  <button class="menu-toggle md:hidden ml-6 pt-2 scale-150">
    <span class="material-symbols-outlined text-base-text">
      instant_mix
    </span>
  </button>

</div>

<!-- Mobile nav (toggleable, only on mobile) -->
<nav id="nav" class="z-50 hidden md:hidden transition-colors duration-200">
  {{ partial "nav.html" . }}
</nav>
