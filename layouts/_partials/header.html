<!-- Header: Mobile stacked | Tablet/Desktop horizontal -->
<div class="flex flex-col md:flex-row justify-center md:justify-around items-center gap-4 pt-2 pb-2 grayscale-30 max-w-screen-xl mx-auto px-4 lg:px-8">
  
  <!-- Logo -->
  <a href="{{ .Site.BaseURL }}" class="flex-shrink-0">
    <img id="logo" src="/img/logo.webp" alt="{{ .Site.Title }}" 
         class="w-40 md:w-36 lg:w-50 h-auto p-2 animate-[spin_3s_ease-in-out] img-glow" 
         width="150" height="150" fetchpriority="high">
  </a>
  
  <!-- Mobile menu toggle (hidden on md+) -->
  <button class="menu-toggle md:hidden pt-2 scale-150">
    <span class="material-symbols-outlined text-base-text">
      instant_mix
    </span>
  </button>
  
  <!-- Desktop nav (always visible on md+) -->
  <nav class="hidden md:flex z-50 transition-colors duration-200">
    {{ partial "nav.html" . }}
  </nav>
</div>

<!-- Mobile nav (toggleable, only on mobile) -->
<nav id="nav" class="z-50 hidden md:hidden transition-colors duration-200">
  {{ partial "nav.html" . }}
</nav>

<h1 class="md:hidden glitch flex text-center glow justify-center" data-text="{{ .Site.Title }}">
  {{ .Site.Title }}
</h1>
